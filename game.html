<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading Game... - HTML5 Gaming Paradise</title>
    
    <style>
        /* ============================================
           CSS RESET & FRIV DARK THEME
           ============================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ============================================
           HEADER & NAVIGATION
           ============================================ */
        header {
            background: linear-gradient(135deg, #0f0c20, #15102a);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #e94560;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo a {
            color: #e94560;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .back-btn {
            background: #e94560;
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }
        .back-btn:hover {
            background: #ff5273;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        /* ============================================
           MAIN LAYOUT (Friv Grid Arena)
           ============================================ */
        .arena-container {
            max-width: 1400px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .arena-container {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================
           GAME SCREEN & IFRAME
           ============================================ */
        .game-main {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-container {
            position: relative;
            width: 100%;
            /* 16:9 黄金游戏比例，如果是复古街机可以调成 4:3 (75%) */
            padding-top: 56.25%; 
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #4f3b78;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================
           GAME INFO BOX (动态数据展示区)
           ============================================ */
        .game-info-card {
            background: #161233;
            border-left: 5px solid #e94560;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .game-meta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .game-title {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .game-stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .stat-tag {
            background: #251f4f;
            padding: 4px 10px;
            border-radius: 6px;
            color: #00f2fe;
            font-weight: 600;
        }
        .stat-tag.rating {
            color: #ffcc00;
        }
        .game-description {
            font-size: 15px;
            line-height: 1.6;
            color: #b3b3cc;
        }

        /* ============================================
           SIDEBAR RECOMMENDATIONS (Friv Thumbnails)
           ============================================ */
        .sidebar-recommend {
            background: #0f0c20;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #251f4f;
            height: fit-content;
        }
        .sidebar-recommend h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #251f4f;
            padding-bottom: 8px;
        }
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (max-width: 1024px) {
            .rec-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        .rec-card {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rec-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .rec-card:hover {
            transform: scale(1.05);
            border-color: #e94560;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.6);
        }
        .rec-title-hover {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 12, 32, 0.85);
            color: white;
            font-size: 11px;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .rec-card:hover .rec-title-hover {
            opacity: 1;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: #4f3b78;
            font-size: 13px;
            margin-top: auto;
            border-top: 1px solid #0f0c20;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="/">Crazy Games</a>
        </div>
        <a href="/" class="back-btn">⬅ Back to Home</a>
    </header>

    <main class="arena-container">
        
        <section class="game-main">
            <div class="video-container">
                <iframe id="gameFrame" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
            </div>

            <article class="game-info-card">
                <div class="game-meta-header">
                    <h1 class="game-title" id="gameTitle">Loading game info...</h1>
                    <div class="game-stats">
                        <span class="stat-tag" id="gamePlayers">👥 0 个玩家</span>
                        <span class="stat-tag rating" id="gameRating">⭐ 0.0</span>
                    </div>
                </div>
                <p class="game-description" id="gameDesc">
                    Please wait while we set up the gaming sandbox environment for you...
                </p>
            </article>
        </section>

        <aside class="sidebar-recommend">
            <h3>Popular Games</h3>
            <div class="rec-grid" id="recommendationGrid">
                </div>
        </aside>

    </main>

    <footer>
        &copy; 2026 Crazy Games Sandbox. All Rights Reserved.
    </footer>

    <script src="games.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 确保全局数据库成功加载
            if (typeof games === 'undefined' || typeof gameDetails === 'undefined' || typeof getGameDataFromURL !== 'function') {
                console.error("数据字典或查找函数加载失败，请检查 /games.js 路径。");
                document.getElementById('gameTitle').textContent = "Database Error";
                document.getElementById('gameDesc').textContent = "Failed to load game assets. Please refresh or contact admin.";
                return;
            }

            // 2. 调用我们在 games.js 编写的智能解析函数
            var currentGame = getGameDataFromURL();

            if (currentGame) {
                // 3. 动态更新网页标题 (SEO 优化)
                document.title = "Play " + currentGame.title + " Online - Free HTML5 Games";

                // 4. 渲染文本信息到 DOM 节点
                document.getElementById('gameTitle').textContent = currentGame.title;
                document.getElementById('gameDesc').textContent = currentGame.desc;
                document.getElementById('gameRating').textContent = "⭐ " + currentGame.rating;
                document.getElementById('gamePlayers').textContent = "👥 " + currentGame.players + " Players";

                // 5. 注入第三方（如 GameDistribution）真实的远程 Iframe H5 链接
                if (currentGame.gameId) {
                    var iframeUrl = "https://html5.gamedistribution.com/" + currentGame.gameId + "/";
                    document.getElementById('gameFrame').src = iframeUrl;
                } else {
                    document.getElementById('gameDesc').textContent += " (⚠️ Warning: Game ID missing, cannot load iframe)";
                }

                // 6. 生成侧边栏推荐（排除当前正在玩的这一款）
                generateSidebarRecommendations(currentGame.key);

            } else {
                // 异常处理：无法从 URL 解析出合法的游戏
                console.error("无法匹配此 URL 的游戏路由。");
                document.getElementById('gameTitle').textContent = "Game Not Found";
                document.getElementById('gameDesc').textContent = "Sorry, the game you are looking for does not exist in our sandbox database.";
                generateSidebarRecommendations(""); // 全力推荐
            }
        });

        /**
         * Friv 风格侧边栏游戏推荐卡片生成引擎
         */
        function generateSidebarRecommendations(currentKey) {
            var grid = document.getElementById('recommendationGrid');
            if (!grid) return;

            // 过滤掉当前正在玩的，并随机打乱或直接取出前 6 款游戏作为侧边栏小图
            var filteredGames = games.filter(function(g) { return g[0] !== currentKey; });
            
            // 限制最多展示 6 个推荐位
            var displayLimit = filteredGames.slice(0, 6);

            var htmlBuffer = "";
            displayLimit.forEach(function(item) {
                var nameKey = item[0];      // "Tap_Arrow_Away"
                var path = item[1];         // "/games/tap-arrow-away/"
                var thumb = item[4];        // 封面图 URL
                var cleanTitle = nameKey.replace(/_/g, ' ');

                htmlBuffer += `
                    <div class="rec-card" onclick="window.location.href='${path}'">
                        <img src="${thumb}" alt="${cleanTitle}" loading="lazy">
                        <div class="rec-title-hover">${cleanTitle}</div>
                    </div>
                `;
            });

            grid.innerHTML = htmlBuffer;
        }
    </script>
</body>
</html>
