<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Free Online Games - Vortexly</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
   
    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #1f2833;
            --text-pure: #ffffff;
            --text-muted: #858585;
            --accent: #c5a059;
            --accent-hover: #e5c079;
            --border-color: #2c3539;
            --card-bg: #151a22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-pure);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo a {
            color: var(--accent);
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
        }
        .back-btn {
            background: transparent;
            color: var(--text-pure);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            flex: 1;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .iframe-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }
        .control-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .control-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .info-card h1 { font-size: 28px; margin-bottom: 10px; }
        .description { color: var(--text-muted); line-height: 1.6; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-title { font-size: 18px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .rec-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .rec-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px; display: flex; gap: 12px; cursor: pointer;
        }
        .rec-card img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="/">Vortexly</a></div>
        <a href="/" class="back-btn">← Back to Home</a>
    </header>

    <main class="main-container">
        <section class="game-wrapper">
            <div class="iframe-container">
                <iframe id="gameIframe" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
            </div>

            <div class="control-bar">
                <div>
                    <span style="color: var(--accent);" id="gameRating">⭐ 4.5</span>
                </div>
                <button class="control-btn" onclick="goFullScreen()">🖵 Fullscreen</button>
            </div>

            <article class="info-card">
                <h1 id="gameTitle">Loading game title...</h1>
                <p class="description" id="gameDesc">Loading game description...</p>
            </article>
        </section>

        <aside class="sidebar">
            <h2 class="sidebar-title">Popular Games</h2>
            <div class="rec-grid" id="recommendationGrid"></div>
        </aside>
    </main>

    <script src="/games.js"></script>

    <script>
   document.addEventListener('DOMContentLoaded', function() {
    if (typeof gameDetails === 'undefined' || typeof games === 'undefined') {
        console.error("games.js 加载失败");
        return;
    }

    // 兼容两种取参方式：1. 伪静态路径 /games/xxx/  2. query参数 ?slug=xxx
    function getGameSlug() {
        // 先尝试从路径取
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const gamesIndex = pathParts.indexOf('games');
        if (gamesIndex > -1 && pathParts[gamesIndex + 1]) {
            return pathParts[gamesIndex + 1].toLowerCase();
        }
        // 路径取不到，再从URL参数取
        const params = new URLSearchParams(window.location.search);
        const slugParam = params.get('slug');
        return slugParam ? slugParam.toLowerCase() : '';
    }

    const slugFromUrl = getGameSlug();
    console.log("最终解析到的游戏slug:", slugFromUrl);

    // slug转格式匹配gameDetails的键名（tap-arrow-away → Tap_Arrow_Away）
    const matchedKey = Object.keys(gameDetails).find(function(key) {
        return key.toLowerCase().replace(/_/g, '-') === slugFromUrl;
    });

    if (matchedKey) {
        const details = gameDetails[matchedKey];
        const gameName = matchedKey.replace(/_/g, ' ');

        console.log("匹配到游戏:", gameName, "GD ID:", details.gameId);

        // 渲染页面信息
        document.title = gameName + " - Play on Vortexly";
        document.getElementById('gameTitle').textContent = gameName;
        document.getElementById('gameDesc').textContent = details.desc;
        document.getElementById('gameRating').textContent = "⭐ " + (details.rating || "4.5");

        // 注入游戏iframe
        const iframe = document.getElementById('gameIframe');
        if (iframe && details.gameId) {
            iframe.src = "https://html5.gamedistribution.com/" + details.gameId + "/";
        }

        // 渲染右侧推荐
        generateSidebar(matchedKey);
    } else {
        document.getElementById('gameTitle').textContent = "Game Not Found";
        console.warn("未匹配到对应游戏");
    }
});
    </script>
</body>
</html>
