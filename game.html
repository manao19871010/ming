<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title id="pageTitle">Free Online Games - Vortexly</title>
    <meta name="description" id="pageDesc" content="Play free online games on Vortexly. No download, no sign-up required.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" id="canonicalTag" href="https://vortexly.com/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Vortexly">
    <meta id="ogTitle"    property="og:title"       content="Play Free Games - Vortexly">
    <meta id="ogDesc"     property="og:description" content="Play free online games on Vortexly">
    <meta id="ogUrl"      property="og:url"         content="https://vortexly.com/">
    <meta id="ogImage"    property="og:image"       content="https://vortexly.com/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json" id="schemaScript">{}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 968px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .game-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 1.5rem;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🔴 游戏详情红框展示区域 */
        .game-info {
            border: 2px solid #ef4444; 
            padding: 1rem;
            border-radius: 8px;
            background-color: rgba(239, 68, 68, 0.05);
            position: relative;
        }

        /* 右上角倒计时人性化常驻小标签 */
        .timer-notice {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ef4444;
            color: white;
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .game-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .game-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tag {
            background-color: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .rating {
            color: #fbbf24;
            font-weight: 600;
        }

        .game-desc {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .sidebar {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        footer {
            background-color: var(--bg-card);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #334155;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Vortexly</a>
        <nav class="nav-links">
            <a href="/">Home</a>
        </nav>
    </header>

    <main>
        <div class="game-container">
            <div class="iframe-wrapper">
                <iframe id="gameIframe" src="about:blank" allowfullscreen></iframe>
            </div>
            
            <div class="game-info">
               
            </div>
            <div class="game-action-buttons" style="margin-top: 1.5rem; display: flex; gap: 10px;">
    <button onclick="goFullScreen()" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-expand"></i> Fullscreen
    </button>
    <a href="/" style="background: #334155; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-home"></i> Back to Home
    </a>
</div>
        </div>

        <div class="sidebar">
            <h2>Recommended</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">More games coming soon!</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Vortexly. All rights reserved.</p>
    </footer>
<script src="/games.js"></script>
    <script>

// 详情页核心控制逻辑 (同时适配本地测试与 Cloudflare Pages 伪静态环境)
// ============================================

document.addEventListener('DOMContentLoaded', () => {
    const pathname = window.location.pathname; // 获取当前路径，如 "/games/tap-arrow-away/"
    let slug = null;

    // 1. 路由兼容性解析提取 Slug
    if (pathname.includes('/games/')) {
        // 线上环境：从 Cloudflare 伪静态路由中提取游戏 Slug
        const pathParts = pathname.split('/').filter(Boolean);
        const gamesIndex = pathParts.indexOf('games');
        if (gamesIndex !== -1 && pathParts[gamesIndex + 1]) {
            slug = pathParts[gamesIndex + 1];
        }
    } else {
        // 本地环境：从 URL 参数 ?slug=xxx 中提取
        const urlParams = new URLSearchParams(window.location.search);
        slug = urlParams.get('slug');
    }

    if (slug) {
        slug = slug.trim().toLowerCase().replace(/^\/+|\/+$/g, '');
    } else {
        console.error("无法提取到有效的游戏 slug");
        if (document.getElementById('gameTitle')) document.getElementById('gameTitle').textContent = "URL Error";
        return;
    }

    // 2. 🎯 在匹配 games.js 数据库时，把数据库的原名也转换为中划线进行比对
    const game = games.find(item => {
        if (!item || !item[0]) return false;
        const gameDatabaseSlug = item[0].trim().toLowerCase().replace(/_/g, '-').replace(/ /g, '-');
        return gameDatabaseSlug === slug;
    });

    // 如果未找到对应数据
    if (!game) {
        console.error("未找到匹配的游戏数据:", slug);
        if (document.getElementById('gameTitle')) document.getElementById('gameTitle').textContent = "Game Not Found";
        if (document.getElementById('gameDesc')) document.getElementById('gameDesc').textContent = "Sorry, the game you are looking for does not exist in our database.";
        return;
    }

    // 3. 提取并清洗基础数据
    const gameRawName = game[0]; // "Tap_Arrow_Away"
    const gameName = gameRawName.replace(/_/g, ' '); // "Tap Arrow Away"
    const gdId = game[12]; // 游戏分发 ID

        details = gameDetails[gameRawName];
    }

    if (!details.desc && game[6]) {
        details.desc = `Play ${gameName}, a free online ${game[6].split(' ')[0]} game on Vortexly. Enjoy full screen gameplay with no downloads required!`;
    }

    const currentHost = window.location.origin;
    const gdUrl = `https://html5.gamedistribution.com/${gdId}/?gd_sdk_referrer_url=${currentHost}`;

    // 5. 动态替换页面头部 SEO Meta 标签
    document.title = `${gameName} - Play Free Online on Vortexly`;
    if (document.getElementById('pageTitle')) document.getElementById('pageTitle').textContent = `${gameName} - Play on Vortexly`;
    if (document.getElementById('pageDesc')) document.getElementById('pageDesc').setAttribute('content', details.desc);
    if (document.getElementById('canonicalTag')) document.getElementById('canonicalTag').setAttribute('href', window.location.href);

    // 6. 渲染核心 UI 数据
    if (document.getElementById('gameTitle'))  document.getElementById('gameTitle').textContent = gameName;
    if (document.getElementById('gameGenre'))  document.getElementById('gameGenre').textContent = game[6] ? game[6].split(' ')[0] : "Games";
    if (document.getElementById('gameRating')) document.getElementById('gameRating').textContent = `⭐ ${details.rating || '4.5'}`;
    if (document.getElementById('gameDesc'))   document.getElementById('gameDesc').textContent = details.desc;
    
    // 🔴 【移除误伤逻辑】如果你想让玩家留下来玩游戏，记得隐藏或删除之前那个“2秒返回首页”的倒计时！
    if (document.getElementById('redirectTimer')) {
        document.getElementById('redirectTimer').style.display = 'none'; 
    }

    // 7. 完美加载游戏画面
    const iframe = document.getElementById('gameIframe');
    if (iframe) {
        iframe.src = gdUrl;
    }
    
    console.log(`=== 游戏 [${gameName}] 详情渲染成功 ===`);
});
    </script>
</body>
</html>
