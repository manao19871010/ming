<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title id="pageTitle">Free Online Games - Vortexly</title>
    <meta name="description" id="pageDesc" content="Play free online games on Vortexly. No download, no sign-up required.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" id="canonicalTag" href="https://vortexly.com/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Vortexly">
    <meta id="ogTitle"    property="og:title"       content="Play Free Games - Vortexly">
    <meta id="ogDesc"     property="og:description" content="Play free online games on Vortexly">
    <meta id="ogUrl"      property="og:url"         content="https://vortexly.com/">
    <meta id="ogImage"    property="og:image"       content="https://vortexly.com/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json" id="schemaScript">{}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        .game-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 1.5rem;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🔴 游戏详情红框展示区域 */
        .game-info {
            border: 2px solid #ef4444; 
            padding: 1rem;
            border-radius: 8px;
            background-color: rgba(239, 68, 68, 0.05);
            position: relative;
        }

        .game-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .game-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tag {
            background-color: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .rating {
            color: #fbbf24;
            font-weight: 600;
        }

        .game-desc {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 右侧侧边栏样式 */
        .sidebar {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        /* 💡 2. 谷歌广告专用包裹样式 */
        .sidebar-ad-wrapper {
            margin-top: 0.5rem;
            text-align: center;
            border-top: 1px dashed rgba(148, 163, 184, 0.15);
            padding-top: 1.5rem;
        }

        .ad-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .ad-slot-box {
            width: 100%;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            background-color: var(--bg-card);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #334155;
            margin-top: auto;
        }

        /* 响应式媒体查询：当屏幕小于 968px 时，单列显示 */
        @media (max-width: 968px) {
            main {
                grid-template-columns: 1fr;
            }
            .sidebar {
                margin-top: 1.5rem; /* 💡 移动端掉到下方时拉开安全间距，防止搓屏幕误触广告被谷歌惩罚 */
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Vortexly</a>
        <nav class="nav-links">
            <a href="/">Home</a>
        </nav>
    </header>

    <main>
        <div class="game-container">
            <div class="iframe-wrapper">
                <iframe id="gameIframe" src="about:blank" allowfullscreen></iframe>
            </div>
            
            <div class="game-info">
                <div class="game-meta">
                    <span class="tag" id="gameGenre">Casual</span>
                    <span class="rating" id="gameRating">⭐ 4.5</span>
                </div>
                <h1 class="game-title" id="gameTitle">Loading Game...</h1>
                <p class="game-desc" id="gameDesc">
                    Please wait while the game is loading. If it takes too long, try refreshing the page.
                </p>
            </div>

            <div class="game-action-buttons" style="margin-top: 1.5rem; display: flex; gap: 10px;">
                <button onclick="goFullScreen()" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-expand"></i> Fullscreen
                </button>
                <a href="/" style="background: #334155; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>

        <div class="sidebar">
            <div>
                <h2>Recommended</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">More games coming soon!</p>
            </div>

            <div class="sidebar-ad-wrapper">
                <div class="ad-label">Advertisement</div>
                <div class="ad-slot-box">
                    
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" 
                         data-ad-slot="YYYYYYYYYY"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>
                         (adsbygoogle = window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost' ? window.adsbygoogle || [] : []).push({});
                    </script>

                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Vortexly. All rights reserved.</p>
    </footer>

    <script src="games.js"></script>
    <script>

// 详情页核心控制逻辑 (同时适配本地测试与 Cloudflare Pages 伪静态环境)
// ============================================

document.addEventListener('DOMContentLoaded', () => {
    const pathname = window.location.pathname; 
    let slug = null;

    // 1. 路由兼容性解析提取 Slug
    if (pathname.includes('/games/')) {
        const pathParts = pathname.split('/').filter(Boolean);
        const gamesIndex = pathParts.indexOf('games');
        if (gamesIndex !== -1 && pathParts[gamesIndex + 1]) {
            slug = pathParts[gamesIndex + 1];
        }
    } else {
        const urlParams = new URLSearchParams(window.location.search);
        slug = urlParams.get('slug');
    }

    if (slug) {
        slug = slug.trim().toLowerCase().replace(/^\/+|\/+$/g, '');
    } else {
        console.error("无法提取到有效的游戏 slug");
        if (document.getElementById('gameTitle')) document.getElementById('gameTitle').textContent = "URL Error";
        return;
    }

    // 2. 匹配 games.js 数据库
    const game = games.find(item => {
        if (!item || !item[0]) return false;
        const gameDatabaseSlug = item[0].trim().toLowerCase().replace(/_/g, '-').replace(/ /g, '-');
        return gameDatabaseSlug === slug;
    });

    if (!game) {
        console.error("未找到匹配的游戏数据:", slug);
        if (document.getElementById('gameTitle')) document.getElementById('gameTitle').textContent = "Game Not Found";
        if (document.getElementById('gameDesc')) document.getElementById('gameDesc').textContent = "Sorry, the game you are looking for does not exist in our database.";
        return;
    }

    // 3. 提取并清洗基础数据
    const gameRawName = game[0]; 
    const gameName = gameRawName.replace(/_/g, ' '); 
    const gdId = game[12];

        details = gameDetails[gameRawName];
    }

    if (!details.desc && game[6]) {
        details.desc = `Play ${gameName}, a free online ${game[6].split(' ')[0]} game on Vortexly. Enjoy full screen gameplay with no downloads required!`;
    }

    const currentHost = window.location.origin;
    const gdUrl = `https://html5.gamedistribution.com/${gdId}/?gd_sdk_referrer_url=${currentHost}`;

    // 5. 动态替换页面头部 SEO Meta 标签
    document.title = `${gameName} - Play Free Online on Vortexly`;
    if (document.getElementById('pageTitle')) document.getElementById('pageTitle').textContent = `${gameName} - Play on Vortexly`;
    if (document.getElementById('pageDesc')) document.getElementById('pageDesc').setAttribute('content', details.desc);
    if (document.getElementById('canonicalTag')) document.getElementById('canonicalTag').setAttribute('href', window.location.href);

    // 6. 渲染核心 UI 数据
    if (document.getElementById('gameTitle'))  document.getElementById('gameTitle').textContent = gameName;
    if (document.getElementById('gameGenre'))  document.getElementById('gameGenre').textContent = game[6] ? game[6].split(' ')[0] : "Games";
    if (document.getElementById('gameRating')) document.getElementById('gameRating').textContent = `⭐ ${details.rating || '4.5'}`;
    if (document.getElementById('gameDesc'))   document.getElementById('gameDesc').textContent = details.desc;
    
    // 7. 完美加载游戏画面
    const iframe = document.getElementById('gameIframe');
    if (iframe) {
        iframe.src = gdUrl;
    }
    
    console.log(`=== 游戏 [${gameName}] 详情渲染成功 ===`);
});

// 核心全屏控制函数
function goFullScreen() {
    const iframe = document.getElementById('gameIframe');
    if (iframe) {
        if (iframe.requestFullscreen) { iframe.requestFullscreen(); }
        else if (iframe.mozRequestFullScreen) { iframe.mozRequestFullScreen(); }
        else if (iframe.webkitRequestFullscreen) { iframe.webkitRequestFullscreen(); }
        else if (iframe.msRequestFullscreen) { iframe.msRequestFullscreen(); }
    }
}
    </script>
