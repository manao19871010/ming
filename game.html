<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title id="pageTitle">Free Online Games - Vortexly</title>
    <meta name="description" id="pageDesc" content="Play free online games on Vortexly. No download, no sign-up required.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" id="canonicalTag" href="https://vortexly.com/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Vortexly">
    <meta id="ogTitle"    property="og:title"       content="Play Free Games - Vortexly">
    <meta id="ogDesc"     property="og:description" content="Play free online games on Vortexly">
    <meta id="ogUrl"      property="og:url"         content="https://vortexly.com/">
    <meta id="ogImage"    property="og:image"       content="https://vortexly.com/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json" id="schemaScript">{}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #1f2833;
            --text-main: #c5a059;
            --text-pure: #ffffff;
            --text-muted: #858585;
            --accent: #c5a059;
            --accent-hover: #e5c079;
            --border-color: #2c3539;
            --card-bg: #151a22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-pure);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo a {
            color: var(--accent);
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn {
            background: transparent;
            color: var(--text-pure);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            flex: 1;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .control-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: var(--accent-hover);
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
        }

        .info-card h1 {
            font-size: 28px;
            color: var(--text-pure);
            margin-bottom: 10px;
        }

        .meta-tags {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tag {
            font-size: 13px;
            color: var(--accent);
            background: rgba(197, 160, 89, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-pure);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .rec-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .rec-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            gap: 12px;
            padding: 8px;
        }

        .rec-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .rec-card img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .rec-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .rec-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-pure);
            margin-bottom: 4px;
        }

        .rec-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-top: auto;
        }

        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                margin-top: 20px;
            }
            .rec-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="/">Vortexly</a></div>
        <a href="/" class="back-btn">← Back to Home</a>
    </header>

    <main class="main-container">
        <section class="game-wrapper">
            <div class="iframe-container">
                <iframe id="gameIframe" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
            </div>

            <div class="control-bar">
                <div class="meta-tags">
                    <span class="tag" id="gameGenre">Loading...</span>
                    <span class="tag" id="gameRating">⭐ 4.5</span>
                </div>
                <button class="control-btn" onclick="goFullScreen()">🖵 Fullscreen</button>
            </div>

            <article class="info-card">
                <h1 id="gameTitle">Loading game title...</h1>
                <p class="description" id="gameDesc">Loading game description...</p>
            </article>
        </section>

        <aside class="sidebar">
            <h2 class="sidebar-title">Popular Games</h2>
            <div class="rec-grid" id="recommendationGrid"></div>
        </aside>
    </main>

    <footer>
        &copy; 2026 Vortexly. All Rights Reserved.
    </footer>

    <script src="/games.js"></script>

    <script>
    // 右边 Friv 风格卡片生成机制
    function generateSidebar(currentKey) {
        var grid = document.getElementById('recommendationGrid');
        if (!grid || typeof games === 'undefined') return;

        var filtered = games.filter(function(g) { return g[0] !== currentKey; });
        var topGames = filtered.slice(0, 5); 

        var html = "";
        topGames.forEach(function(item) {
            var key = item[0];
            var path = item[1];
            var thumb = item[4];
            var displayTitle = key.replace(/_/g, ' ');

            html += `
                <div class="rec-card" onclick="window.location.href='${path}'">
                    <img src="${thumb}" alt="${displayTitle}">
                    <div class="rec-info">
                        <div class="rec-name">${displayTitle}</div>
                        <div class="rec-meta">🎮 Play Free</div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    // ============================================
    // 🚀 初始化与数据深度映射绑定
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof games === 'undefined' || typeof gameDetails === 'undefined') {
            console.error("games.js 数据包未成功载入");
            return;
        }

        // 1. 精准抓取 URL 标识
        var rawPath = window.location.pathname;
        var cleanPath = rawPath.toLowerCase().replace(/^\/+|\/+$/g, ''); 
        var slugFromUrl = "";

        if (cleanPath.startsWith('games/')) {
            slugFromUrl = cleanPath.replace('games/', ''); 
        }

        if (!slugFromUrl) {
            document.getElementById('gameTitle').textContent = "Game Not Found";
            return;
        }

        // 2. 核心比对：将 URL 的 "tap-arrow-away" 对齐回数据库的 "Tap_Arrow_Away"
        var matchedKey = Object.keys(gameDetails).find(function(key) {
            return key.toLowerCase().replace(/_/g, '-') === slugFromUrl;
        });

        if (matchedKey) {
            var details = gameDetails[matchedKey];
            var gameName = matchedKey.replace(/_/g, ' ');

            // 3. 【绝对修复】从一维数组对应项的下标 12 里，精准拔出真实的 GD ID
            var baseInfo = games.find(function(g) { return g[0] === matchedKey; }) || [];
            var realGdId = baseInfo[12] || ""; 
            var gdUrl = "https://html5.gamedistribution.com/" + realGdId + "/";

            console.log("[Success] 精准提取到真实 GD 哈希 ID:", realGdId);

            // 4. 填充 SEO 顶层标签
            document.title = gameName + " - Play on Vortexly";
            if (document.getElementById('pageDesc')) document.getElementById('pageDesc').setAttribute('content', details.desc);
            if (document.getElementById('canonicalTag')) document.getElementById('canonicalTag').setAttribute('href', window.location.href);

            // 5. 渲染底部的文字盒子
            if (document.getElementById('gameTitle'))  document.getElementById('gameTitle').textContent = gameName;
            if (document.getElementById('gameDesc'))   document.getElementById('gameDesc').textContent = details.desc;
            if (document.getElementById('gameRating')) document.getElementById('gameRating').textContent = "⭐ " + (details.rating || "4.5");
            if (document.getElementById('gameGenre'))  document.getElementById('gameGenre').textContent = baseInfo[6] ? baseInfo[6].split(' ')[0] : "Games";

            // 6. 【致命一击】把完全合法的 GD 嵌入式链接丢进大绿框内
            var iframe = document.getElementById('gameIframe');
            if (iframe && realGdId) {
                iframe.src = gdUrl;
                console.log("🎉 Iframe 画面通道全面打通:", gdUrl);
            } else {
                console.error("Iframe 未找到，或该游戏的 GD ID 在数组下标 12 处为空！");
            }

            // 7. 渲染右侧关联推荐卡片
            generateSidebar(matchedKey);
        } else {
            if (document.getElementById('gameTitle')) document.getElementById('gameTitle').textContent = "Game Sandbox Not Found";
            generateSidebar("");
        }
    });

    // 全屏核心指令
    function goFullScreen() {
        const iframe = document.getElementById('gameIframe');
        if (iframe) {
            if (iframe.requestFullscreen) { iframe.requestFullscreen(); }
            else if (iframe.mozRequestFullScreen) { iframe.mozRequestFullScreen(); }
            else if (iframe.webkitRequestFullscreen) { iframe.webkitRequestFullscreen(); }
            else if (iframe.msRequestFullscreen) { iframe.msRequestFullscreen(); }
        }
    }
    </script>
</body>
</html>
