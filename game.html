<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Free Online Games - Vortexly</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #1f2833;
            --text-pure: #ffffff;
            --text-muted: #858585;
            --accent: #c5a059;
            --accent-hover: #e5c079;
            --border-color: #2c3539;
            --card-bg: #151a22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-pure);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo a {
            color: var(--accent);
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
        }
        .back-btn {
            background: transparent;
            color: var(--text-pure);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            flex: 1;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .iframe-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }
        .control-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .control-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .info-card h1 { font-size: 28px; margin-bottom: 10px; }
        .description { color: var(--text-muted); line-height: 1.6; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-title { font-size: 18px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .rec-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .rec-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px; display: flex; gap: 12px; cursor: pointer;
        }
        .rec-card img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="/">Vortexly</a></div>
        <a href="/" class="back-btn">← Back to Home</a>
    </header>

    <main class="main-container">
        <section class="game-wrapper">
            <div class="iframe-container">
                <iframe id="gameIframe" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
            </div>

            <div class="control-bar">
                <div>
                    <span style="color: var(--accent);" id="gameRating">⭐ 4.5</span>
                </div>
                <button class="control-btn" onclick="goFullScreen()">🖵 Fullscreen</button>
            </div>

            <article class="info-card">
                <h1 id="gameTitle">Loading game title...</h1>
                <p class="description" id="gameDesc">Loading game description...</p>
            </article>
        </section>

        <aside class="sidebar">
            <h2 class="sidebar-title">Popular Games</h2>
            <div class="rec-grid" id="recommendationGrid"></div>
        </aside>
    </main>

    <script src="/games.js"></script>

    <script>
    // 渲染右侧推荐卡片
    function generateSidebar(currentKey) {
        var grid = document.getElementById('recommendationGrid');
        if (!grid || typeof games === 'undefined') return;
        var filtered = games.filter(function(g) { return g[0] !== currentKey; });
        var html = "";
        filtered.slice(0, 5).forEach(function(item) {
            html += `
                <div class="rec-card" onclick="window.location.href='${item[1]}'">
                    <img src="${item[4]}" alt="${item[0]}">
                    <div>
                        <div style="font-size: 14px; font-weight:500;">${item[0].replace(/_/g, ' ')}</div>
                        <div style="font-size: 12px; color: var(--text-muted);">🎮 Play Free</div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof gameDetails === 'undefined') {
            console.error("无法载入 games.js 数据配置");
            return;
        }

        // 1. 拆解浏览器地址栏参数
        var rawPath = window.location.pathname;
        var cleanPath = rawPath.toLowerCase().replace(/^\/+|\/+$/g, ''); 
        var slugFromUrl = "";

        if (cleanPath.startsWith('games/')) {
            slugFromUrl = cleanPath.replace('games/', '').replace(/\/+$/, '');
        }

        console.log("[解密成功] 参数片段为:", slugFromUrl);

        // 2. 在数据库中对齐大写 Key
        var matchedKey = Object.keys(gameDetails).find(function(key) {
            return key.toLowerCase().replace(/_/g, '-') === slugFromUrl;
        });

        if (matchedKey) {
            var details = gameDetails[matchedKey];
            var gameName = matchedKey.replace(/_/g, ' ');

            // 3. 【超级核心】彻底抛弃数组查找！直接从对象属性里拔出 gameId 
            var realGdId = details.gameId || "";
            
            console.log("[核心验证] 直读拿到的真实 GD 哈希 ID 是:", realGdId);

            // 4. 动态更改标题和文本渲染
            document.title = gameName + " - Play on Vortexly";
            document.getElementById('gameTitle').textContent = gameName;
            document.getElementById('gameDesc').textContent = details.desc;
            document.getElementById('gameRating').textContent = "⭐ " + (details.rating || "4.5");

            // 5. 打开渲染通道注入到大绿框
            var iframe = document.getElementById('gameIframe');
            if (iframe && realGdId) {
                iframe.src = "https://html5.gamedistribution.com/" + realGdId + "/";
                console.log("🎉 [绝杀成功] Iframe 画面通道已被强制疏通！");
            } else {
                console.error("未在对应的 gameDetails 配置中发现 gameId 字段！");
            }

            generateSidebar(matchedKey);
        } else {
            document.getElementById('gameTitle').textContent = "Game Not Found";
        }
    });

    function goFullScreen() {
        const iframe = document.getElementById('gameIframe');
        if (iframe && iframe.requestFullscreen) { iframe.requestFullscreen(); }
    }
    </script>
</body>
</html>
