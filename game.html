<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title id="pageTitle">Free Online Games - Vortexly</title>
    <meta name="description" id="pageDesc" content="Play free online games on Vortexly. No download, no sign-up required.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" id="canonicalTag" href="https://vortex-ly.com/">

    <meta property=\"og:type\" content=\"website\">
    <meta property=\"og:site_name\" content=\"Vortexly\">
    <meta id="ogTitle"    property="og:title"       content="Play Free Games - Vortexly">
    <meta id="ogDesc"     property="og:description" content="Play free online games on Vortexly">
    <meta id="ogUrl"      property="og:url"         content="https://vortex-ly.com/">
    <meta id="ogImage"    property="og:image"       content="https://vortex-ly.com/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json" id="schemaScript">{}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 968px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .game-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 1.5rem;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🔴 这里就是展示游戏信息的红框区域样式 */
        .game-info {
            border: 2px solid #ef4444; /* 红色边框，确认它能显示 */
            padding: 1rem;
            border-radius: 8px;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .game-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .game-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tag {
            background-color: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .rating {
            color: #fbbf24;
            font-weight: 600;
        }

        .game-desc {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .sidebar {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        footer {
            background-color: var(--bg-card);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #334155;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Vortexly</a>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/?cat=action">Action</a>
            <a href="/?cat=puzzle">Puzzle</a>
        </nav>
    </header>

    <main>
        <div class="game-container">
            <div class="iframe-wrapper">
                <iframe id="gameIframe" src="about:blank" allowfullscreen></iframe>
            </div>
            
            <div class="game-info">
                <div class="game-meta">
                    <span id="gameGenre" class="tag">Loading...</span>
                    <span id="gameRating" class="rating">⭐ --</span>
                </div>
                <h1 id="gameTitle" class="game-title">Loading Game...</h1>
                <p id="gameDesc" class="game-desc">Loading game descriptions and details...</p>
            </div>
        </div>

        <div class="sidebar">
            <h2>Recommended</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">More games coming soon!</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Vortexly. All rights reserved.</p>
    </footer>

    <script src="/games.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 2. 获取当前网址路径和参数
            const pathname = window.location.pathname;
            const urlParams = new URLSearchParams(window.location.search);
            let slug = null;

            // 3. 稳健路由嗅探：完美适配 Cloudflare 伪静态路径 /games/xxx/
            if (pathname.includes('/games/')) {
                const pathParts = pathname.split('/').filter(Boolean);
                const gamesIndex = pathParts.indexOf('games');
                if (gamesIndex !== -1 && pathParts[gamesIndex + 1]) {
                    slug = pathParts[gamesIndex + 1];
                }
            }

            // 本地测试降级容错：尝试从 ?slug= 参数里抓取
            if (!slug) {
                slug = urlParams.get('slug') || '';
            }

            // 清洗 slug 去除多余的空格和可能粘连的斜杠
            slug = slug.trim().toLowerCase().replace(/^\/+|\/+$/g, '');
            console.log("=== [Vortexly] 成功捕获游戏 Slug ===:", slug);

            // 4. 精准比对数据库（games.js）
            const game = games.find(item => {
                if (!item || !item[0]) return false;
                // 将数据库名字（如 Tap_Arrow_Away）统一转换为小写连字符格式进行安全对比
                const gameDatabaseSlug = item[0].trim().toLowerCase().replace(/_/g, '-').replace(/ /g, '-');
                return gameDatabaseSlug === slug;
            });

            // 如果找不到游戏，安全返回首页，避免卡在 Loading 页面
            if (!game) {
                console.error("在 games.js 中找不到该游戏匹配项:", slug);
                window.location.replace('/');
                return;
            }

            // 5. 成功匹配，开始提取核心数据
            const gameRawName = game[0]; // 数据库原名，用于去描述字典里找 key
            const gameName = gameRawName.replace(/_/g, ' '); // 替换下划线为空格用于展示
            const gdId = game[12]; // 获取小游戏分发 ID
            
            // 6. 🔴 终极大小写防护：安全抓取描述信息（完美兼容小写的 gamedetails 或大写 gameDetails）
            var details = { desc: "", rating: "4.5" };
            
            if (typeof gamedetails !== 'undefined' && gamedetails[gameRawName]) {
                details = gamedetails[gameRawName]; // 适配你 games.js 里真实存在的小写对象
            } else if (typeof gameDetails !== 'undefined' && gameDetails[gameRawName]) {
                details = gameDetails[gameRawName]; // 兼容可能存在的大写对象
            }

            // 如果字典里实在没有写描述，用游戏的分类动态生成一句完美的 SEO 描述，防止红框空白
            if (!details.desc && game[6]) {
                details.desc = `Play ${gameName}, a free online ${game[6].split(' ')[0]} game on Vortexly. Enjoy fullscreen gameplay with no downloads required!`;
            }

            // 7. 动态识别并生成当前主机的安全 Referrer 地址提供给 SDK
            const currentHost = window.location.origin;
            const gdUrl = `https://html5.gamedistribution.com/${gdId}/?gd_sdk_referrer_url=${currentHost}`;

            // 8. 顶级谷歌动态 SEO Meta 标签渲染
            document.title = `${gameName} - Play Free Online on Vortexly`;
            if (document.getElementById('pageTitle')) document.getElementById('pageTitle').textContent = `${gameName} - Play on Vortexly`;
            if (document.getElementById('pageDesc')) document.getElementById('pageDesc').setAttribute('content', details.desc);
            if (document.getElementById('canonicalTag')) document.getElementById('canonicalTag').setAttribute('href', window.location.href);

            // 9. 🎯 严丝合缝对齐 ID，将数据填入红框
            if (document.getElementById('gameTitle'))  document.getElementById('gameTitle').textContent = gameName;
            if (document.getElementById('gameGenre'))  document.getElementById('gameGenre').textContent = game[6] ? game[6].split(' ')[0] : "Games";
            if (document.getElementById('gameRating')) document.getElementById('gameRating').textContent = `⭐ ${details.rating || '4.5'}`;
            if (document.getElementById('gameDesc'))   document.getElementById('gameDesc').textContent = details.desc;
            
            // 10. 唤醒小游戏画面：向 iframe 塞入游戏地址
            const iframe = document.getElementById('gameIframe');
            if (iframe) {
                iframe.src = gdUrl;
            }
        });
    </script>
</body>
</html>
