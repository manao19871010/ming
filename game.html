<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading Game... - HTML5 Gaming Paradise</title>
    
    <style>
        /* ============================================
           CSS RESET & FRIV DARK THEME
           ============================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ============================================
           HEADER & NAVIGATION
           ============================================ */
        header {
            background: linear-gradient(135deg, #0f0c20, #15102a);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #e94560;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo a {
            color: #e94560;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .back-btn {
            background: #e94560;
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }
        .back-btn:hover {
            background: #ff5273;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        /* ============================================
           MAIN LAYOUT (Friv Grid Arena)
           ============================================ */
        .arena-container {
            max-width: 1400px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .arena-container {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================
           GAME SCREEN & IFRAME
           ============================================ */
        .game-main {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-container {
            position: relative;
            width: 100%;
            /* 16:9 黄金游戏比例，如果是复古街机可以调成 4:3 (75%) */
            padding-top: 56.25%; 
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #4f3b78;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================
           GAME INFO BOX (动态数据展示区)
           ============================================ */
        .game-info-card {
            background: #161233;
            border-left: 5px solid #e94560;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .game-meta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .game-title {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .game-stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .stat-tag {
            background: #251f4f;
            padding: 4px 10px;
            border-radius: 6px;
            color: #00f2fe;
            font-weight: 600;
        }
        .stat-tag.rating {
            color: #ffcc00;
        }
        .game-description {
            font-size: 15px;
            line-height: 1.6;
            color: #b3b3cc;
        }

        /* ============================================
           SIDEBAR RECOMMENDATIONS (Friv Thumbnails)
           ============================================ */
        .sidebar-recommend {
            background: #0f0c20;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #251f4f;
            height: fit-content;
        }
        .sidebar-recommend h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #251f4f;
            padding-bottom: 8px;
        }
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (max-width: 1024px) {
            .rec-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        .rec-card {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rec-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .rec-card:hover {
            transform: scale(1.05);
            border-color: #e94560;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.6);
        }
        .rec-title-hover {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 12, 32, 0.85);
            color: white;
            font-size: 11px;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .rec-card:hover .rec-title-hover {
            opacity: 1;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: #4f3b78;
            font-size: 13px;
            margin-top: auto;
            border-top: 1px solid #0f0c20;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="/">Crazy Games</a>
        </div>
        <a href="/" class="back-btn">⬅ Back to Home</a>
    </header>

    <main class="arena-container">
        
        <section class="game-main">
            <div class="video-container">
                <iframe id="gameFrame" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
            </div>

            <article class="game-info-card">
                <div class="game-meta-header">
                    <h1 class="game-title" id="gameTitle">Loading game info...</h1>
                    <div class="game-stats">
                        <span class="stat-tag" id="gamePlayers">👥 0 个玩家</span>
                        <span class="stat-tag rating" id="gameRating">⭐ 0.0</span>
                    </div>
                </div>
                <p class="game-description" id="gameDesc">
                    Please wait while we set up the gaming sandbox environment for you...
                </p>
            </article>
        </section>

        <aside class="sidebar-recommend">
            <h3>Popular Games</h3>
            <div class="rec-grid" id="recommendationGrid">
                </div>
        </aside>

    </main>

    <footer>
        &copy; 2026 Crazy Games Sandbox. All Rights Reserved.
    </footer>

    <script src="/games.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // ============================================
    // ⚙️ 线上超级容错路由解析引擎
    // ============================================
    function AutoMatchGame() {
        // 1. 获取当前线上的真实路径 (例如: "/games/tap-arrow-away/" 或 "/games/tap-arrow-away")
        var rawPath = window.location.pathname;
        console.log("[Debug] 当前页面 URL 路径 (pathname):", rawPath);

        // 2. 将路径转化为小写，并去掉开头和结尾的斜杠，防止 Cloudflare 伪静态斜杠不一致
        var cleanPath = rawPath.toLowerCase().replace(/^\/+|\/+$/g, ''); 
        console.log("[Debug] 标准化后的路径 (cleanPath):", cleanPath); // 变成 "games/tap-arrow-away"

        var slugFromUrl = "";

        // 3. 提取真正的游戏 Slug
        if (cleanPath.startsWith('games/')) {
            slugFromUrl = cleanPath.replace('games/', ''); // 得到 "tap-arrow-away"
        } else {
            // 【本地兼容】如果本地是用 ?game= 传参
            var urlParams = new URLSearchParams(window.location.search);
            var queryParam = urlParams.get('game') || urlParams.get('name');
            if (queryParam) {
                slugFromUrl = queryParam.toLowerCase().replace(/_/g, '-');
            }
        }

        console.log("[Debug] 提取出的游戏标识 (slugFromUrl):", slugFromUrl);

        if (!slugFromUrl) return null;

        // 4. 开始在数据库中匹配 (支持 games 数组和 gameDetails 字典)
        // 匹配逻辑：把数据库里的 Key（如 "Tap_Arrow_Away"）转成小写、下划线换成中划线，去对齐 URL
        var targetKey = Object.keys(gameDetails).find(function(key) {
            var formattedKey = key.toLowerCase().replace(/_/g, '-');
            return formattedKey === slugFromUrl;
        });

        if (targetKey) {
            console.log("[Debug] 🎉 成功在数据库中匹配到 Key:", targetKey);
            
            // 提取一维数组 games 里的基础数据（如封面、gameId）
            var baseInfo = games.find(function(g) { return g[0] === targetKey; }) || [];
            
            return {
                key: targetKey,
                title: targetKey.replace(/_/g, ' '),   // 自动把下划线换成空格作为标题
                desc: gameDetails[targetKey].desc,
                players: gameDetails[targetKey].players || "1.2k",
                rating: gameDetails[targetKey].rating || "4.5",
                gameId: baseInfo[12] || ""             // 数组第 13 项是你的游戏远程 ID
            };
        }

        console.warn("[Debug] ❌ 在 games.js 数据库中未找到匹配的游戏。");
        return null;
    }

    // ============================================
    // 🚀 执行渲染逻辑
    // ============================================
    // 检查全局变量是否成功从 games.js 加载
    if (typeof games === 'undefined' || typeof gameDetails === 'undefined') {
        console.error("【致命错误】games.js 未成功加载！请检查 <script src='/games.js'> 的路径是否正确，或者文件是否有语法错误。");
        document.getElementById('gameTitle').textContent = "Database Error";
        document.getElementById('gameDesc').textContent = "Failed to load games.js database.";
        return;
    }

    var currentGame = AutoMatchGame();

    if (currentGame) {
        // 1. 修改标签页标题
        document.title = "Play " + currentGame.title + " Online - Free HTML5 Games";

        // 2. 填充文本数据到界面
        if (document.getElementById('gameTitle')) document.getElementById('gameTitle').textContent = currentGame.title;
        if (document.getElementById('gameDesc'))  document.getElementById('gameDesc').textContent = currentGame.desc;
        if (document.getElementById('gameRating')) document.getElementById('gameRating').textContent = "⭐ " + currentGame.rating;
        if (document.getElementById('gamePlayers')) document.getElementById('gamePlayers').textContent = "👥 " + currentGame.players + " Players";

        // 3. 动态加载游戏 Iframe 核心主体
        if (currentGame.gameId && document.getElementById('gameFrame')) {
            var iframeUrl = "https://html5.gamedistribution.com/" + currentGame.gameId + "/";
            console.log("[Debug] 正在载入游戏 Iframe 链接:", iframeUrl);
            document.getElementById('gameFrame').src = iframeUrl;
        } else {
            console.error("[Debug] 无法载入 Iframe：未找到对应的 gameId。");
        }

        // 4. 生成侧边栏推荐
        if (typeof generateSidebarRecommendations === 'function') {
            generateSidebarRecommendations(currentGame.key);
        }

    } else {
        // 降级容错：如果没有匹配到任何游戏信息
        document.getElementById('gameTitle').textContent = "Game Sandbox";
        document.getElementById('gameDesc').textContent = "Welcome! Please select a game from the right panel to start playing.";
        if (typeof generateSidebarRecommendations === 'function') generateSidebarRecommendations("");
    }
});
    </script>
</body>
</html>
